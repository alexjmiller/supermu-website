<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <!-- Static form definitions for Netlify's build-time form detection.
         The real form is client-rendered in app/components/WaitlistForm.tsx
         and POSTs url-encoded data to this path. -->
    <form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
    </form>
  </body>
</html>
